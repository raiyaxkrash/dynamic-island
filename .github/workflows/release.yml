name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node --check ui/island.js
      - run: node --check ui/i18n.js
      - run: node --check ui/settings.js
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - name: Prepare release assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" "dist-release/Dynamic-Island-$ver-x64-setup.exe"
          Copy-Item "src-tauri/target/release/dynamic-island.exe" "dist-release/dynamic-island-$ver-x64-portable.exe"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
